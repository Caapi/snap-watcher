name: Snap watcher

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (GitHub sometimes runs these late)
  workflow_dispatch:
    inputs:
      test_email:
        description: "Just send a test email"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: snap-watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check Snap fares
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: |
          if [ "${{ inputs.test_email }}" = "true" ]; then
            python watcher.py --test-email
          else
            python watcher.py
          fi

      - name: Save price snapshot
        run: |
          git config user.name "snap-watcher"
          git config user.email "snap-watcher@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Nothing new to save."
            exit 0
          fi
          git commit -m "Snap check $(date -u +%Y-%m-%dT%H:%MZ)" --quiet
          for i in 1 2 3; do
            git pull --rebase --quiet && git push --quiet && exit 0
            sleep 5
          done
          echo "Couldn't push the snapshot after 3 tries." && exit 1
